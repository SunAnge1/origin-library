<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Origin Library - Auth</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="login.css" />
    </head>
    <body>
        <main> 
         <section class="glass">
            <div class="dashboard"></div>
            
            <!-- Dynamic Title -->
            <h1 id="formTitle">Welcome</h1>
            
            <form id="authForm">
                <input type="text" id="username" placeholder="Full name" required>
                <input type="text" id="displayName" class="hidden" placeholder="Username">
                <input type="text" id="email" class="hidden" placeholder="Email">
                <input type="password" id="password" placeholder="Password" required>
                <p id="authMessage" style="font-size: 0.85rem; display:none;"></p>
                <button type="submit" id="submitBtn">Login</button>
            </form>

            <!-- Toggle Link -->
            <p style="color: white; font-size: 0.9rem; margin-top: 15px;">
                <span id="toggleText">Need an account?</span> 
                <a href="#" id="toggleLink" style="color: #61dafb; font-weight: bold; text-decoration: none;">Register</a>
            </p>

            <div class="circle1"></div>
            <div class="circle2"></div>
         </section>
        </main>
        <script src="login.js"></script>
    </body>  
</html>
